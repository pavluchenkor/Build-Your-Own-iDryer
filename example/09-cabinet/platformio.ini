# NB: это ИСПРАВЛЕННЫЙ platformio.ini для аудита воспроизводимости.
# lib/idryer-core подключён симлинком (а не через file://).
#
# Окружения:
#   cabinet      — рабочая прошивка устройства (src/main.cpp).
#   cabinet-demo — то же без датчиков: показания даёт модель шкафа.
#   bench   — стендовый тест без облака (src/bench_main.cpp): датчики + логика
#             + GPIO + петля обратной связи, всё видно в Serial.

[env:cabinet]
platform    = espressif32
framework   = arduino
board       = esp32-c3-devkitm-1

; Библиотеки ядра (MQTT, ArduinoJson, WebSockets, Improv) приходят сами
; из lib/idryer-core/library.json. Здесь — только драйвер датчика.
lib_deps =
    robtillaart/SHT31 @ ^0.5.0

; ESPAsyncTCP — транспорт ESP8266 из зависимостей espMqttClient: на ESP32
; не собирается.
lib_ignore = ESPAsyncTCP

build_flags =
    -Isrc/menu
    -DIDRYER_API_BASE='"https://portal.idryer.org/api"'
    -DMQTT_BROKER='"mqtt.idryer.org"'
    -DMQTT_PORT=8883
    -DMQTT_USE_TLS=1

build_src_filter = +<*> -<bench_main.cpp>

extra_scripts =
    pre:extra_scripts/pre_gen_menu.py

# Без датчиков: показания даёт модель шкафа (src/demo_sensors.h).
[env:cabinet-demo]
extends = env:cabinet
build_flags =
    ${env:cabinet.build_flags}
    -DDEMO_SENSORS=1

[env:bench]
extends = env:cabinet
build_src_filter = +<*> -<main.cpp>
build_flags =
    ${env:cabinet.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
