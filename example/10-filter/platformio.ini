# Умный фильтр воздуха из раздела 10 «Собери сам».
# lib/idryer-core подключён симлинком на библиотеку ядра.
#
# Окружения:
#   filter      — рабочая прошивка устройства (SGP40 на I2C).
#   filter-demo — то же без датчика: индекс VOC даёт модель воздуха
#                 (src/demo_voc.h), вентилятор виден по состоянию GPIO.

[env:filter]
platform    = espressif32
framework   = arduino
board       = esp32-c3-devkitm-1

; Библиотеки ядра (MQTT, ArduinoJson, WebSockets, Improv) приходят сами
; из lib/idryer-core/library.json. Здесь — только драйвер датчика.
lib_deps =
    adafruit/Adafruit SGP40 Sensor @ ^1.1.0

; ESPAsyncTCP — транспорт ESP8266 из зависимостей espMqttClient: на ESP32
; не собирается.
lib_ignore = ESPAsyncTCP

build_flags =
    ; Лог Serial на USB-порт платы: у ESP32-C3 без этих двух флагов вывод
    ; уходит на UART0, и монитор порта остаётся пустым.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DIDRYER_API_BASE='"https://portal.idryer.org/api"'
    -DMQTT_BROKER='"mqtt.idryer.org"'
    -DMQTT_PORT=8883
    -DMQTT_USE_TLS=1

# Без датчика: индекс VOC даёт модель воздуха (src/demo_voc.h).
[env:filter-demo]
extends = env:filter
build_flags =
    ${env:filter.build_flags}
    -DDEMO_VOC=1
